included:
  - Sources
  - Tests
  - Package.swift

opt_in_rules:
  - attributes
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 150
file_length:
  warning: 150
  error: 200
type_body_length:
  warning: 100
  error: 150
function_body_length:
  warning: 30
  error: 50
cyclomatic_complexity:
  warning: 8
  error: 12
